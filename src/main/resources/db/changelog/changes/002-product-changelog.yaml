databaseChangeLog:
  - changeSet:
      id: 002-1-create-categories
      author: gulay
      changes:
        - createTable:
            tableName: categories
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_categories_name

              - column:
                  name: description
                  type: VARCHAR(500)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "NOW()"
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: categories


  - changeSet:
      id: 002-2-create-products
      author: gulay
      comment: "Products table - things sellers list for sale"

      changes:
        - createTable:
            tableName: products
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(2000)

              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: stock_quantity
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: image_url
                  type: VARCHAR(500)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: seller_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "NOW()"
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: "NOW()"
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: products


  - changeSet:
      id: 002-3-products-foreign-keys
      author: gulay
      comment: "Link products to their category and seller"

      changes:
        - addForeignKeyConstraint:
            constraintName: fk_products_category
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_products_seller
            baseTableName: products
            baseColumnNames: seller_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: products
            constraintName: fk_products_category
        - dropForeignKeyConstraint:
            baseTableName: products
            constraintName: fk_products_seller


  - changeSet:
      id: 002-4-products-check-constraints
      author: gulay
      comment: "Price must be positive, stock cant be negative"

      changes:
        - sql:
            sql: >
              ALTER TABLE products
              ADD CONSTRAINT chk_products_price CHECK (price > 0);

              ALTER TABLE products
              ADD CONSTRAINT chk_products_stock CHECK (stock_quantity >= 0);
            rollback: >
              ALTER TABLE products DROP CONSTRAINT IF EXISTS chk_products_price;
              ALTER TABLE products DROP CONSTRAINT IF EXISTS chk_products_stock;

  # -------------------------------------------------------
  # 002-5: indexes
  # -------------------------------------------------------
  - changeSet:
      id: 002-5-product-indexes
      author: anar
      comment: "Indexes for search, filtering and seller dashboard"

      changes:
        - createIndex:
            indexName: idx_products_category_id
            tableName: products
            columns:
              - column:
                  name: category_id

        - createIndex:
            indexName: idx_products_seller_id
            tableName: products
            columns:
              - column:
                  name: seller_id

        - createIndex:
            indexName: idx_products_active
            tableName: products
            columns:
              - column:
                  name: active

        - createIndex:
            indexName: idx_products_price
            tableName: products
            columns:
              - column:
                  name: price

        - createIndex:
            indexName: idx_categories_active
            tableName: categories
            columns:
              - column:
                  name: active

      rollback:
        - dropIndex:
            indexName: idx_products_category_id
            tableName: products
        - dropIndex:
            indexName: idx_products_seller_id
            tableName: products
        - dropIndex:
            indexName: idx_products_active
            tableName: products
        - dropIndex:
            indexName: idx_products_price
            tableName: products
        - dropIndex:
            indexName: idx_categories_active
            tableName: categories
