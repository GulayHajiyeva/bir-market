# using h2 for tests so we dont need a real postgres running
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=false

jwt.secret=test-secret-key-birmarket-testing-only-must-be-long-enough-256-bits
jwt.expiration=86400000

logging.level.com.birmarket=WARN

iyzico.api-key=test-api-key
iyzico.secret-key=test-secret-key
iyzico.base-url=https://sandbox-api.iyzipay.com

springdoc.swagger-ui.path=/swagger-ui.html

minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=password123
minio.bucket=birmarket-test
